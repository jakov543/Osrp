<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Character creator -->
  <div id="creator" class="creator hidden">
    <div class="panel">
      <div class="brand"><img class="emb" src="emblem.png" alt="" /><div><b>OSRP</b><small>OSIJEK ROLEPLAY</small></div></div>
      <h1>Novi lik</h1>
      <p class="muted">Napravi svog lika za Osijek Roleplay.</p>
      <label>Ime<input id="firstname" maxlength="20" placeholder="npr. Marko" /></label>
      <label>Prezime<input id="lastname" maxlength="20" placeholder="npr. Horvat" /></label>
      <label>Datum rođenja<input id="dob" type="date" min="1940-01-01" max="2008-12-31" value="2000-01-01" /></label>
      <div class="sex">
        <button class="on" data-sex="m">Muško</button>
        <button data-sex="f">Žensko</button>
      </div>
      <div class="err" id="err"></div>
      <button class="go" id="go">Uđi u Osijek</button>
    </div>
  </div>

  <!-- HUD (GTA health/armour + minimap stay; we replace cash, street name and vehicle info) -->
  <div id="hud" class="hud hidden">
    <div class="h-top">
      <img class="h-emb" src="emblem.png" alt="" />
      <div class="h-who">
        <div class="h-name" id="hName">—</div>
        <div class="h-job" id="hJob">—</div>
      </div>
    </div>
    <div class="h-money">
      <div class="h-row cash"><i>
        <svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zm0 0 2-3h12l2 3M17 13h.01"/></svg></i>
        <span>Gotovina</span><b id="hCash">$0</b></div>
      <div class="h-row bank"><i>
        <svg viewBox="0 0 24 24"><path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg></i>
        <span>Banka</span><b id="hBank">$0</b></div>
    </div>
    <div id="hDelta" class="h-delta"></div>
  </div>

  <div id="loc" class="loc hidden">
    <div class="compass" id="lDir">S</div>
    <div class="l-txt">
      <div class="street" id="lStreet">—</div>
      <div class="zone"><span id="lZone">Osijek</span><em id="lTime">12:00</em></div>
    </div>
  </div>

  <div id="speedo" class="speedo hidden">
    <svg class="dial" viewBox="0 0 200 200">
      <defs>
        <linearGradient id="rpmG" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1fd6b6"/><stop offset=".7" stop-color="#f4b740"/><stop offset="1" stop-color="#ef4444"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="100" cy="100" r="84" pathLength="100"/>
      <circle class="rpm" id="sRpm" cx="100" cy="100" r="84" pathLength="100"/>
      <g id="ticks"></g>
    </svg>
    <div class="s-mid">
      <div class="s-gear" id="sGear">N</div>
      <div class="s-speed" id="sSpeed">0</div>
      <div class="s-unit">KM/H</div>
    </div>
    <div class="s-bars">
      <div class="s-bar fuel"><svg viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3M7 8h5"/></svg><div class="bar"><span id="sFuel"></span></div></div>
      <div class="s-bar eng"><svg viewBox="0 0 24 24"><path d="M5 9h3l2-2h5l2 3h2v6h-2l-2 2H9l-2-2H5zM2 11v4M12 4v3"/></svg><div class="bar"><span id="sEng"></span></div></div>
    </div>
    <div class="s-light" id="sLight">◐</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
