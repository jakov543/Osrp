<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dialog.css" />
  <link rel="stylesheet" href="bulet.css" />
  <link rel="stylesheet" href="cine.css" />
  <link rel="stylesheet" href="bikes.css" />
</head>
<body>
  <!-- minimap (replaces the GTA radar inside Osijek) - v1.0.35 redesign -->
  <div id="radar" class="radar hidden">
    <div class="clip">
      <div id="layer" class="layer">
        <img id="mapImg" src="map.png" alt="" />
        <svg id="route" class="route"></svg>
        <div id="marks"></div>
      </div>
      <div class="vignette"></div>
      <div class="me" id="me"><svg viewBox="0 0 24 28"><path d="M12 1 L22 26 L12 20 L2 26 Z" /></svg></div>
      <div class="north" id="north">N</div>
      <div class="rd-dist hidden" id="rdDist"></div>
    </div>
  </div>

  <!-- big map (F7 / /karta) - v1.0.35 redesign -->
  <div id="big" class="big hidden">
    <aside class="side">
      <div class="brand"><b>OSIJEK</b><small>Karta grada</small></div>
      <div class="here">
        <small>Tvoja lokacija</small>
        <div id="hereTxt">—</div>
      </div>
      <div class="wpbox hidden" id="wpBox">
        <small>GPS točka</small>
        <div class="wprow"><span id="wpTxt">—</span><button id="wpClear" title="Makni točku">✕</button></div>
      </div>
      <input id="search" class="search" placeholder="Traži mjesto…" autocomplete="off" />
      <div class="places" id="places"></div>
      <div class="legend">
        <span><i class="lg bld"></i>Zgrade</span><span><i class="lg road"></i>Ceste</span>
        <span><i class="lg park"></i>Parkovi</span><span><i class="lg water"></i>Drava</span>
        <span><i class="lg bike"></i>Biciklistička</span><span><i class="lg gps"></i>GPS ruta</span>
      </div>
      <div class="keys"><kbd>Klik</kbd> točka <kbd>Desni</kbd> makni <kbd>Kotačić</kbd> zoom <kbd>ESC</kbd> zatvori</div>
    </aside>
    <div class="big-view" id="view">
      <div class="big-layer" id="bigLayer">
        <img id="bigImg" alt="" />
        <svg id="bigRoute" class="route"></svg>
        <div id="bigMarks"></div>
      </div>
      <div class="tools">
        <button id="zIn" title="Približi">+</button>
        <button id="zOut" title="Udalji">−</button>
        <button id="zMe" title="Centriraj na mene">◎</button>
      </div>
      <div class="cursor" id="cursorTxt"></div>
      <button id="close" class="close">✕</button>
    </div>
  </div>
  <script src="map.js"></script>
  <script src="dialog.js"></script>
  <script src="bulet.js"></script>
  <script src="cine.js"></script>
  <script src="bikes.js"></script>
  <script src="sirens.js"></script>
</body>
</html>
