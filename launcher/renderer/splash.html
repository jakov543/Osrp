<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>OSRP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none;
      font-family: "Segoe UI", system-ui, sans-serif; color: #e8edf4; -webkit-app-region: drag; }
    .box { position: absolute; inset: 10px; border-radius: 26px; overflow: hidden;
      background: radial-gradient(420px 300px at 50% 0%, rgba(25,195,166,.25), transparent 70%),
                  radial-gradient(420px 300px at 50% 110%, rgba(242,177,52,.16), transparent 70%), #07090d;
      border: 1px solid #1f2937; box-shadow: 0 20px 60px rgba(0,0,0,.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .glow { position: absolute; width: 260px; height: 260px; border-radius: 50%; top: 60px;
      background: radial-gradient(circle, rgba(25,195,166,.35), transparent 65%); filter: blur(10px);
      animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.15); opacity: .6; } }
    .icon { width: 170px; height: 170px; position: relative; animation: pop .9s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .name { margin-top: 22px; font-size: 52px; font-weight: 900; letter-spacing: 12px; padding-left: 12px;
      background: linear-gradient(90deg, #19c3a6, #f2b134); -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: up .7s .35s ease both; }
    .sub { color: #8b97a8; letter-spacing: 7px; font-size: 11px; font-weight: 700; margin-top: 2px; padding-left: 7px; animation: up .7s .5s ease both; }
    @keyframes up { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    .bottom { position: absolute; left: 44px; right: 44px; bottom: 44px; animation: up .6s .7s ease both; }
    .bar { height: 5px; background: #141b26; border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: linear-gradient(90deg, #19c3a6, #f2b134); transition: width .35s ease;
      box-shadow: 0 0 12px rgba(25,195,166,.8); }
    .row { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #8b97a8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="glow"></div>
    <img class="icon" src="assets/icon.png" alt="OSRP" />
    <div class="name">OSRP</div>
    <div class="sub">OSIJEK ROLEPLAY</div>
    <div class="bottom">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="row"><span id="text">Pokrećem...</span><span id="pct">0%</span></div>
    </div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
