<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1fd6b6"/><stop offset="1" stop-color="#f4b740"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16202c"/><stop offset="1" stop-color="#070a0f"/></linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3a3"/><stop offset=".55" stop-color="#f4b740"/><stop offset="1" stop-color="#c9822a"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0fa58c"/><stop offset=".5" stop-color="#2ef0cc"/><stop offset="1" stop-color="#0fa58c"/></linearGradient>
    <clipPath id="sh"><path d="M256 40 L440 98 V250 C440 360 360 430 256 474 C152 430 72 360 72 250 V98 Z"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- shield -->
  <path d="M256 40 L440 98 V250 C440 360 360 430 256 474 C152 430 72 360 72 250 V98 Z" fill="url(#bg)"/>
  <g clip-path="url(#sh)">
    <circle cx="256" cy="215" r="150" fill="#1fd6b6" opacity=".07"/>
    <!-- side towers -->
    <path d="M176 330 V250 L192 214 L208 250 V330 Z" fill="url(#tower)" opacity=".55"/>
    <path d="M304 330 V250 L320 214 L336 250 V330 Z" fill="url(#tower)" opacity=".55"/>
    <!-- nave -->
    <path d="M198 330 V282 L256 248 L314 282 V330 Z" fill="url(#tower)" opacity=".75"/>
    <!-- main tower + spire + pinnacles -->
    <g filter="url(#glow)">
      <path d="M226 330 V170 L232 160 H280 L286 170 V330 Z" fill="url(#tower)"/>
      <path d="M256 62 L284 162 H228 Z" fill="url(#tower)"/>
      <path d="M224 170 L229 140 L234 170 Z M278 170 L283 140 L288 170 Z" fill="url(#tower)"/>
      <rect x="252" y="40" width="8" height="26" rx="2" fill="#ffe3a3"/>
      <rect x="244" y="48" width="24" height="6" rx="2" fill="#ffe3a3"/>
    </g>
    <!-- windows: clock, belfry, rose, door -->
    <circle cx="256" cy="196" r="11" fill="#0b1118"/><circle cx="256" cy="196" r="7" fill="none" stroke="#f4b740" stroke-width="2"/>
    <path d="M246 236 V222 Q256 208 266 222 V236 Z" fill="#0b1118"/>
    <circle cx="256" cy="268" r="9" fill="#0b1118"/>
    <path d="M246 330 V306 Q256 292 266 306 V330 Z" fill="#0b1118"/>
    <!-- Drava -->
    <rect x="60" y="330" width="400" height="160" fill="#07131a"/>
    <path d="M60 344 Q100 330 140 344 T220 344 T300 344 T380 344 T460 344" fill="none" stroke="url(#wave)" stroke-width="9" stroke-linecap="round"/>
    <path d="M60 372 Q100 358 140 372 T220 372 T300 372 T380 372 T460 372" fill="none" stroke="url(#wave)" stroke-width="7" stroke-linecap="round" opacity=".6"/>
    <path d="M60 398 Q100 386 140 398 T220 398 T300 398 T380 398 T460 398" fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" opacity=".3"/>
  </g>
  <!-- rim -->
  <path d="M256 40 L440 98 V250 C440 360 360 430 256 474 C152 430 72 360 72 250 V98 Z" fill="none" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 62 L420 113 V250 C420 348 350 410 256 450 C162 410 92 348 92 250 V113 Z" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
</svg>
