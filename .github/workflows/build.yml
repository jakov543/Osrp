name: Build Osijek Launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OsijekLauncher-Windows
          path: launcher/dist/*.exe

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release v${{ steps.ver.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: OSRP Launcher v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            OSRP Launcher V1 - Osijek Roleplay.
            Download **OSRP-Launcher-Setup-${{ steps.ver.outputs.version }}.exe** below and install it.
            Requires a legal copy of GTA V and FiveM.
          files: launcher/dist/*.exe
          overwrite_files: true
